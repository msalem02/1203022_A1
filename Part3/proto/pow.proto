
syntax = "proto3";

package pow;
option go_package = "example.com/distributedpow/proto;powpb";

service CoordinatorService {
  rpc RegisterWorker(RegisterRequest) returns (RegisterReply);
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatReply);
}

service WorkerService {
  rpc SearchRange(SearchRequest) returns (stream SearchUpdate);
}

message RegisterRequest {
  string worker_id = 1;
  string address = 2;
}

message RegisterReply {
  bool accepted = 1;
}

message HeartbeatRequest {
  string worker_id = 1;
}

message HeartbeatReply {
  bool ok = 1;
}

message SearchRequest {
  string job_id = 1;
  string data = 2;
  uint32 difficulty = 3;
  uint64 start = 4;
  uint64 end = 5;
}

message SearchUpdate {
  string job_id = 1;
  uint64 checked = 2;
  bool finished = 3;
  bool found = 4;
  uint64 nonce = 5;
  string hash = 6;
}
